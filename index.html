<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昨日限時批 - 時光雜貨店</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #141210;
            color: #f4ecd8;
            margin: 0;
            overflow-x: hidden;
        }

        .perspective-2500 { perspective: 2500px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .will-change-transform { will-change: transform, opacity; }

        @keyframes mail-down {
            0% { transform: translateY(-400px) rotateY(180deg) scale(1.5); opacity: 0; }
            15% { opacity: 1; transform: translateY(-200px) rotateY(180deg) scale(1); }
            100% { transform: translateY(180px) rotateY(180deg) scale(0.2); opacity: 0; }
        }
        .animate-mail-down { animation: mail-down 2.5s cubic-bezier(0.45, 0.03, 0.51, 0.95) forwards; }

        @keyframes mailing-flash {
            0%, 60% { opacity: 0; transform: translateY(-20px); }
            75% { opacity: 1; transform: translateY(0); }
            85% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 0; }
        }
        .animate-mailing-flash { animation: mailing-flash 2.5s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        textarea::placeholder { color: #d1d5db; }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icons = {
            Send: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            ),
            Heart: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            ),
            RefreshCw: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            ),
            CheckCircle: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            ),
            Mail: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            ),
            Sparkles: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                    <path d="M5 3v4"/>
                    <path d="M19 17v4"/>
                    <path d="M3 5h4"/>
                    <path d="M17 19h4"/>
                </svg>
            ),
            Calendar: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                    <line x1="16" x2="16" y1="2" y2="6"/>
                    <line x1="8" x2="8" y1="2" y2="6"/>
                    <line x1="3" x2="21" y1="10" y2="10"/>
                </svg>
            ),
            ArrowRight: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                </svg>
            ),
            ArrowLeft: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m12 19-7-7 7-7"/>
                    <path d="M19 12H5"/>
                </svg>
            )
        };

        const App = () => {
            const [step, setStep] = useState('writing'); // writing, mailing, finished, celebration, conclusion
            const [message, setMessage] = useState('');
            const [isFlipped, setIsFlipped] = useState(false);
            const [themeKey, setThemeKey] = useState('sunset');

            const stampImg = "https://images.unsplash.com/photo-1579541814924-49fef17c5be5?auto=format&fit=crop&w=150";

            const themes = useMemo(() => ({
                sunset: {
                    title: '日落',
                    subtitle: '餘暉/傍晚 美/則/美/矣',
                    img: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80',
                },
                sea: {
                    title: '海邊',
                    subtitle: '波光/粼粼 靜/謐/之/境',
                    img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80',
                },
                mountain: {
                    title: '山嶺',
                    subtitle: '層巒/疊嶂 歲/月/悠/長',
                    img: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',
                }
            }), []);

            useEffect(() => {
                const keys = Object.keys(themes);
                setThemeKey(keys[Math.floor(Math.random() * keys.length)]);
            }, [themes]);

            const currentTheme = themes[themeKey];

            const handleSend = () => {
                if (!message.trim()) return;
                setIsFlipped(true);
                setTimeout(() => {
                    setStep('mailing');
                    setTimeout(() => {
                        setStep('finished');
                    }, 2500);
                }, 1200);
            };

            const reset = () => {
                setMessage('');
                setStep('writing');
                setIsFlipped(false);
                const keys = Object.keys(themes);
                setThemeKey(keys[Math.floor(Math.random() * keys.length)]);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 overflow-y-auto">
                    <div className="fixed inset-0 z-0 opacity-10 pointer-events-none" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/wood-pattern.png")' }}></div>

                    <div className="w-full max-w-4xl z-10 relative">
                        {step === 'writing' && (
                            <div className="text-center mb-6 sm:mb-10 animate-in fade-in duration-700">
                                <h1 className="text-3xl sm:text-5xl font-black text-[#f4ecd8] tracking-[0.3em] italic">昨日限時批</h1>
                                <p className="text-amber-600/50 text-[10px] uppercase tracking-[0.5em] mt-2">Memory Postcard Archive</p>
                            </div>
                        )}

                        <div className="perspective-2500 w-full flex justify-center">
                            {step === 'writing' && (
                                <div className={`relative w-full max-w-2xl aspect-[0.8/1] md:aspect-[1.6/1] transition-all duration-[1200ms] transform-style-3d will-change-transform ${isFlipped ? 'rotate-y-180 scale-75 -translate-y-12 opacity-0' : ''}`}>
                                    <div className="card-inner w-full h-full">
                                        <div className="absolute inset-0 bg-[#fffdf9] p-5 sm:p-10 shadow-2xl border border-zinc-200 backface-hidden flex flex-col md:flex-row gap-4 sm:gap-8 rounded-sm overflow-hidden z-20">
                                            <div className="absolute top-4 sm:top-8 left-4 sm:left-10 flex gap-1 opacity-40">
                                                {[1,2,3,4,5,6].map(i => <div key={i} className="w-4 h-6 sm:w-5 sm:h-7 border border-red-500"></div>)}
                                            </div>
                                            <div className="flex-1 flex flex-col pt-10 md:pt-12 text-[#2c1e1a]">
                                                <textarea 
                                                    placeholder="寫給那個曾經的自己... 可以是謝謝，也可以是對不起。"
                                                    className="w-full flex-1 bg-transparent border-none focus:outline-none text-xl sm:text-2xl italic leading-relaxed placeholder:text-zinc-200 resize-none py-2"
                                                    style={{ backgroundImage: 'linear-gradient(transparent, transparent 35px, #e5e5e5 35px)', backgroundSize: '100% 36px' }}
                                                    value={message}
                                                    onChange={(e) => setMessage(e.target.value)}
                                                ></textarea>
                                            </div>
                                            <div className="w-full md:w-60 flex flex-col border-t md:border-t-0 md:border-l border-dotted border-zinc-200 pt-4 md:pt-4 md:pl-8">
                                                <div className="flex justify-end md:justify-end mb-4 md:mb-10">
                                                    <div className="w-16 h-20 sm:w-24 sm:h-28 border-2 border-zinc-200 p-1 flex items-center justify-center bg-white shadow-sm overflow-hidden">
                                                       <img src={stampImg} alt="Stamp" className="w-full h-full object-cover opacity-80" />
                                                    </div>
                                                </div>
                                                <div className="space-y-4 md:space-y-10 text-[#1a1612]">
                                                    <div className="border-b border-zinc-100 text-xs sm:text-sm text-zinc-400 pb-2">
                                                       <span className="font-bold tracking-tighter uppercase whitespace-nowrap">To: </span>
                                                       <span className="text-zinc-800 font-bold ml-2">那個時空的 我</span>
                                                    </div>
                                                    <div className="hidden md:block border-b border-zinc-100 h-8"></div>
                                                    <div className="border-b border-zinc-100 text-xs sm:text-sm text-zinc-400 pb-2">
                                                       <span className="font-bold tracking-tighter uppercase whitespace-nowrap">From: </span>
                                                       <span className="text-zinc-800 font-bold ml-2">現在的我</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="absolute inset-0 bg-white shadow-2xl border border-zinc-200 backface-hidden rotate-y-180 flex flex-col rounded-sm p-3 z-10">
                                            <div className="flex-1 relative overflow-hidden rounded-sm">
                                                <img src={currentTheme.img} alt="Postcard Front" className="w-full h-full object-cover" />
                                            </div>
                                            <div className="h-16 sm:h-20 flex justify-between items-end px-2 pt-2 pb-1 text-[#1a1612]">
                                                <div className="flex items-baseline gap-2 sm:gap-4">
                                                    <span className="text-2xl sm:text-4xl font-black italic tracking-tighter">{currentTheme.title}</span>
                                                    <span className="text-[8px] sm:text-[10px] font-bold text-zinc-300 uppercase tracking-widest">實/拍/明/信/片</span>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-[9px] sm:text-[11px] font-black tracking-widest italic">{currentTheme.subtitle}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 'mailing' && (
                                <div className="flex flex-col items-center">
                                    <div className="absolute top-[-200px] sm:top-[-250px] w-48 sm:w-64 aspect-[1.6/1] bg-white shadow-2xl animate-mail-down overflow-hidden rounded-sm z-50 p-1 border border-zinc-200">
                                        <img src={currentTheme.img} alt="mailing" className="w-full h-full object-cover" />
                                    </div>
                                    <div className="relative w-40 h-64 sm:w-56 sm:h-80 flex flex-col items-center">
                                        <div className="w-32 h-16 sm:w-44 sm:h-20 bg-green-800 rounded-t-full border-t-4 border-green-700 shadow-lg relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-white/10 to-transparent"></div>
                                        </div>
                                        <div className="w-28 h-48 sm:w-40 sm:h-64 bg-green-800 border-x-4 border-green-900 shadow-2xl flex flex-col items-center relative">
                                            <div className="absolute inset-0 bg-gradient-to-r from-black/30 via-transparent to-black/30"></div>
                                            <div className="w-24 h-6 sm:w-32 h-8 bg-zinc-950 mt-6 sm:mt-10 rounded-sm shadow-[inset_0_4px_12px_rgba(0,0,0,1)] flex items-center justify-center relative overflow-hidden">
                                                <div className="absolute inset-0 flex items-center justify-center animate-mailing-flash">
                                                   <div className="w-16 h-12 sm:w-24 sm:h-16 bg-white/20 blur-md"></div>
                                                </div>
                                            </div>
                                            <div className="mt-8 sm:mt-12 w-12 h-12 sm:w-20 sm:h-20 border-4 border-green-700/30 rounded-full flex items-center justify-center bg-green-900/40">
                                               <Icons.Mail size={24} className="text-green-200 opacity-20" />
                                            </div>
                                        </div>
                                        <div className="w-32 h-4 sm:w-48 h-6 bg-zinc-900 rounded-sm shadow-xl"></div>
                                    </div>
                                    <p className="mt-8 sm:mt-16 text-[#f4ecd8] animate-pulse tracking-[1em] font-black uppercase text-xs">穿越時空投遞中...</p>
                                </div>
                            )}

                            {step === 'finished' && (
                                <div className="w-full flex flex-col items-center animate-in zoom-in duration-1000 pb-16 px-2 sm:px-4">
                                    <div className="text-center mb-6 sm:mb-8">
                                        <div className="w-10 h-10 sm:w-12 sm:h-12 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4 border border-amber-500/20">
                                            <Icons.CheckCircle className="text-amber-500" size={24} />
                                        </div>
                                        <h2 className="text-2xl sm:text-3xl font-black text-[#f4ecd8] tracking-widest italic text-center">時光存檔成功</h2>
                                        <p className="text-amber-600/50 text-[8px] sm:text-[10px] font-bold tracking-[0.4em] mt-2 uppercase">Official Memory Capture</p>
                                    </div>

                                    <div className="relative group animate-float max-w-3xl w-full px-2">
                                        <div className="absolute -inset-4 sm:-inset-8 bg-amber-500/5 blur-[40px] sm:blur-[80px] rounded-full"></div>
                                        <div className="relative bg-[#fffdf9] p-4 sm:p-10 shadow-[0_20px_40px_rgba(0,0,0,0.5)] border-[8px] sm:border-[16px] border-white overflow-hidden rounded-sm min-h-[350px] sm:min-h-[460px] flex flex-col md:flex-row gap-6 sm:gap-10">
                                            <div className="absolute inset-0 z-0">
                                                <img src={currentTheme.img} alt="Postcard Background" className="w-full h-full object-cover opacity-60" />
                                                <div className="absolute inset-0 bg-white/10"></div>
                                            </div>
                                            {/* 左側：文字位置居中偏上，營造中間感 */}
                                            <div className="flex-1 flex flex-col pt-12 sm:pt-24 md:pt-28 relative z-10">
                                                <div className="absolute top-[-25px] sm:top-[-36px] left-0 flex gap-1 sm:gap-1.5 opacity-50">
                                                    {[1,2,3,4,5,6].map(i => <div key={i} className="w-4 h-6 sm:w-7 h-9 border-2 border-red-400"></div>)}
                                                </div>
                                                <div 
                                                    className="w-full flex-1 text-[#1a110a] font-black italic leading-relaxed font-serif pt-4 drop-shadow-sm overflow-hidden"
                                                    style={{ 
                                                        fontSize: message.length > 100 ? '1rem' : message.length > 50 ? '1.2rem' : '1.8rem',
                                                        backgroundImage: 'linear-gradient(transparent, transparent 35px, rgba(0,0,0,0.1) 35px)',
                                                        backgroundSize: '100% 36px',
                                                        paddingBottom: '20px'
                                                    }}
                                                >
                                                    "{message}"
                                                </div>
                                            </div>
                                            <div className="w-full md:w-64 flex flex-col border-t md:border-t-0 md:border-l border-dotted border-black/10 pt-4 sm:pt-4 md:pl-10 relative z-10">
                                                <div className="flex justify-end mb-4 sm:mb-12">
                                                    <div className="w-16 h-20 sm:w-28 sm:h-32 border-2 border-black/5 p-1 flex items-center justify-center bg-white shadow-sm overflow-hidden">
                                                        <img src={stampImg} alt="Final Stamp" className="w-full h-full object-cover opacity-90" />
                                                    </div>
                                                </div>
                                                <div className="space-y-4 sm:space-y-12 mt-2 sm:mt-4 text-[#1a110a]">
                                                    <div className="border-b border-black/10 text-[10px] sm:text-sm text-zinc-600 pb-2 flex items-center gap-2">
                                                        <span className="font-bold tracking-tighter uppercase whitespace-nowrap">To: </span>
                                                        <span className="font-black text-sm sm:text-lg tracking-tighter">那個時空的 我</span>
                                                    </div>
                                                    <div className="hidden md:block border-b border-black/10 h-10"></div>
                                                    <div className="border-b border-black/10 text-[10px] sm:text-sm text-zinc-600 pb-2 flex items-center gap-2">
                                                        <span className="font-bold tracking-tighter uppercase whitespace-nowrap">From: </span>
                                                        <span className="font-black text-sm sm:text-lg tracking-tighter">現在的我</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 截圖提示與跳轉按鈕 */}
                                    <div className="mt-8 sm:mt-10 flex flex-col items-center gap-4 sm:gap-5 w-full max-w-md">
                                        <p className="text-[10px] sm:text-xs font-bold tracking-widest text-[#f4ecd8]/60 text-center uppercase">
                                            📸 請先截圖保存這份時光證明
                                        </p>

                                        {/* 跳轉至光賢四季大典專頁 */}
                                        <button 
                                            onClick={() => setStep('celebration')}
                                            className="w-full py-3.5 sm:py-4 px-6 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-[#fcfaf2] font-black tracking-[0.2em] shadow-[0_8px_20px_rgba(217,119,6,0.3)] rounded-lg transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-3 text-sm sm:text-base border border-amber-400/30"
                                        >
                                            <Icons.Sparkles size={18} className="text-amber-200 animate-spin-slow" />
                                            探索光賢：四季大典與聚會
                                            <Icons.ArrowRight size={18} />
                                        </button>

                                        <button onClick={reset} className="px-6 py-2 bg-white/5 border border-white/10 text-[#f4ecd8]/50 hover:text-[#f4ecd8] text-[10px] sm:text-xs font-bold uppercase tracking-[0.3em] rounded-full transition-all">
                                            <Icons.RefreshCw size={12} className="inline mr-2" /> 重新投遞信件
                                        </button>
                                    </div>
                                </div>
                            )}

                            {step === 'celebration' && (
                                <div className="w-full flex flex-col items-center animate-in fade-in duration-700 pb-16 px-2 sm:px-4">
                                    {/* 頂部標題 */}
                                    <div className="text-center mb-6 sm:mb-8 max-w-2xl">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 border border-amber-500/30 rounded-full text-amber-400 text-xs font-bold tracking-widest mb-3">
                                            <Icons.Calendar size={14} />
                                            <span>光賢・四季大典歲時記</span>
                                        </div>
                                        <h2 className="text-2xl sm:text-4xl font-black text-[#f4ecd8] tracking-[0.25em] italic">春生・夏長・秋收・冬藏</h2>
                                        <p className="text-amber-200/60 text-xs sm:text-sm mt-2 leading-relaxed tracking-wider font-light">
                                            在時光的流轉裡，我們相聚在光賢。依循天地節奏安頓身心，更在日常陪伴裡分享溫暖。
                                        </p>
                                    </div>

                                    {/* 溫馨日常項目：三合一橫向小卡 (手作、點心、桌遊) */}
                                    <div className="w-full max-w-3xl mb-6">
                                        <div className="text-center mb-3">
                                            <span className="text-[10px] font-bold text-amber-400/60 uppercase tracking-[0.3em]">
                                                ── 溫馨日常・同樂聚會 ──
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
                                            {/* 手作工藝 */}
                                            <div className="bg-[#201812]/80 p-4 rounded-xl border border-amber-600/20 shadow-md backdrop-blur-sm flex sm:flex-col items-center text-left sm:text-center gap-3">
                                                <div className="w-10 h-10 rounded-lg bg-amber-600/15 border border-amber-600/30 flex items-center justify-center shrink-0 text-xl">
                                                    🎨
                                                </div>
                                                <div>
                                                    <h4 className="text-sm sm:text-base font-black text-[#f4ecd8] tracking-wider mb-1">巧手匠心・手作工藝</h4>
                                                    <p className="text-amber-100/60 text-[11px] sm:text-xs leading-relaxed font-serif">
                                                        編織掛飾與專屬小物，凝聚當季溫暖手感。
                                                    </p>
                                                </div>
                                            </div>

                                            {/* 烘焙點心 */}
                                            <div className="bg-[#201812]/80 p-4 rounded-xl border border-amber-600/20 shadow-md backdrop-blur-sm flex sm:flex-col items-center text-left sm:text-center gap-3">
                                                <div className="w-10 h-10 rounded-lg bg-amber-600/15 border border-amber-600/30 flex items-center justify-center shrink-0 text-xl">
                                                    🍪
                                                </div>
                                                <div>
                                                    <h4 className="text-sm sm:text-base font-black text-[#f4ecd8] tracking-wider mb-1">溫暖滋味・手作點心</h4>
                                                    <p className="text-amber-100/60 text-[11px] sm:text-xs leading-relaxed font-serif">
                                                        共享手揉烘焙與時令茶香，分享日常甘甜。
                                                    </p>
                                                </div>
                                            </div>

                                            {/* 桌遊同樂 */}
                                            <div className="bg-[#201812]/80 p-4 rounded-xl border border-amber-600/20 shadow-md backdrop-blur-sm flex sm:flex-col items-center text-left sm:text-center gap-3">
                                                <div className="w-10 h-10 rounded-lg bg-amber-600/15 border border-amber-600/30 flex items-center justify-center shrink-0 text-xl">
                                                    🎲
                                                </div>
                                                <div>
                                                    <h4 className="text-sm sm:text-base font-black text-[#f4ecd8] tracking-wider mb-1">歡聚共樂・同樂桌遊</h4>
                                                    <p className="text-amber-100/60 text-[11px] sm:text-xs leading-relaxed font-serif">
                                                        歡樂益智互動破冰，感受如家人般的溫度。
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 重點核心：祈福拜拜環節 (獨占大卡片，壓軸視覺重心) */}
                                    <div className="w-full max-w-3xl mb-8">
                                        <div className="relative bg-gradient-to-br from-[#3b2416] via-[#2c1a0e] to-[#1a1008] p-6 sm:p-8 rounded-2xl border-2 border-amber-400/60 shadow-[0_15px_35px_rgba(217,119,6,0.25)] overflow-hidden">
                                            {/* 背景光暈效果 */}
                                            <div className="absolute top-0 right-0 w-64 h-64 bg-amber-400/15 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
                                            <div className="absolute bottom-0 left-0 w-48 h-48 bg-amber-600/10 rounded-full blur-2xl -ml-12 -mb-12 pointer-events-none"></div>

                                            <div className="relative z-10 flex flex-col md:flex-row items-center md:items-start gap-6">
                                                <div className="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gradient-to-b from-amber-400/30 to-amber-700/20 border-2 border-amber-400/50 flex flex-col items-center justify-center shrink-0 shadow-lg">
                                                    <span className="text-4xl sm:text-5xl drop-shadow-md">🙏</span>
                                                    <span className="text-[10px] font-black text-amber-300 tracking-widest mt-1">核心盛典</span>
                                                </div>
                                                <div className="flex-1 text-center md:text-left">
                                                    <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 mb-2">
                                                        <span className="text-amber-300 text-[10px] font-black tracking-widest px-2.5 py-0.5 bg-amber-400/20 rounded-full border border-amber-400/40 uppercase">
                                                            ★ 四季核心精神
                                                        </span>
                                                        <span className="text-amber-200/50 text-[10px] tracking-widest">感謝天恩・沉澱心靈</span>
                                                    </div>
                                                    <h3 className="text-xl sm:text-3xl font-black text-[#fff6e3] tracking-[0.15em] font-serif mb-3">
                                                        誠心祈福・大典禮拜
                                                    </h3>
                                                    <p className="text-amber-100/85 text-xs sm:text-base leading-relaxed font-serif tracking-wide">
                                                        依循大自然的四季律動，在殊勝莊嚴的儀式中叩首感恩、真誠祈福。
                                                        不僅為至親家人與世界祈願平安光明，更是在紛擾生活裡給自己一個安靜的時刻，
                                                        洗滌雜念、重拾內在最純粹的力量與方向。
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 進入下一頁（最後結語）按鈕 */}
                                    <div className="w-full max-w-md flex flex-col items-center gap-3">
                                        <button 
                                            onClick={() => setStep('conclusion')}
                                            className="w-full py-4 px-6 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-[#fcfaf2] font-black tracking-[0.25em] shadow-[0_8px_25px_rgba(217,119,6,0.35)] rounded-xl transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-3 text-sm sm:text-base border border-amber-400/40"
                                        >
                                            <Icons.Sparkles size={18} className="text-amber-200" />
                                            前往雜貨店打烊結語
                                            <Icons.ArrowRight size={18} />
                                        </button>
                                        <button 
                                            onClick={() => setStep('finished')}
                                            className="text-xs text-amber-200/50 hover:text-amber-200 tracking-widest transition-colors py-1 flex items-center gap-1"
                                        >
                                            <Icons.ArrowLeft size={12} /> 返回檢視存檔明信片
                                        </button>
                                    </div>
                                </div>
                            )}

                            {step === 'conclusion' && (
                                <div className="w-full flex flex-col items-center animate-in fade-in zoom-in-95 duration-700 pb-16 px-2 sm:px-4">
                                    {/* 頂部打烊意象招牌 */}
                                    <div className="text-center mb-6 max-w-xl">
                                        <div className="inline-block px-4 py-1 rounded-full bg-amber-500/10 border border-amber-400/30 text-amber-400 text-xs font-black tracking-[0.3em] mb-4 uppercase">
                                            Closing Ceremony
                                        </div>
                                        <h2 className="text-3xl sm:text-5xl font-black text-[#f4ecd8] tracking-[0.25em] italic font-serif">
                                            打烊前的溫柔
                                        </h2>
                                        <p className="text-amber-600/60 text-[10px] uppercase tracking-[0.5em] mt-2 font-mono">
                                            Light Still Shines Behind The Door
                                        </p>
                                    </div>

                                    {/* 復古打烊門牌與溫潤結語卡片 */}
                                    <div className="relative w-full max-w-2xl bg-gradient-to-b from-[#2a1b12] to-[#1a110a] border-4 border-[#8b4513]/60 p-6 sm:p-10 rounded-2xl shadow-[0_25px_50px_rgba(0,0,0,0.8)] overflow-hidden mb-8">
                                        {/* 木紋質感與背後透光效果 */}
                                        <div className="absolute inset-0 opacity-15 pointer-events-none" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/wood-pattern.png")' }}></div>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

                                        {/* 打烊木質標籤掛牌 */}
                                        <div className="flex justify-center mb-6">
                                            <div className="relative px-6 py-2 bg-[#4a2610] border-2 border-amber-500/50 rounded-md shadow-inner flex items-center gap-2">
                                                <div className="w-2 h-2 rounded-full bg-amber-400 animate-ping"></div>
                                                <span className="text-amber-200 text-xs sm:text-sm font-black tracking-[0.3em] font-serif">本日打烊・但燈火常明</span>
                                            </div>
                                        </div>

                                        {/* 店長的結語告白 */}
                                        <div className="relative z-10 space-y-4 text-center sm:text-left font-serif leading-relaxed">
                                            <p className="text-amber-100/90 text-sm sm:text-base leading-loose tracking-wide">
                                                「時間從不回頭，但愛與感謝可以。」
                                            </p>
                                            <p className="text-amber-100/80 text-xs sm:text-sm leading-loose tracking-wide">
                                                就像一部帶著雜訊的 80 年代老膠卷，那些你曾以為遺憾的噪點，終究成了生命裡最有味道的紋理。
                                                謝謝過去那個笨拙、青澀、甚至摔跤過無數次，卻依舊咬著牙撐住的你。
                                            </p>
                                            <p className="text-amber-100/80 text-xs sm:text-sm leading-loose tracking-wide">
                                                走出昨日雜貨店，願你帶著這份溫柔與勇氣，篤定地走向明天。
                                                無論四季如何流轉，光賢的門扉與心裡的燈火，永遠為你溫柔守候。
                                            </p>
                                            <div className="pt-4 border-t border-amber-500/20 text-right">
                                                <span className="text-amber-400/80 text-xs font-bold tracking-[0.2em] italic font-serif">
                                                    —— 昨日雜貨店・光賢賢青 敬誌
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 結尾合照提示與導航按鈕 */}
                                    <div className="w-full max-w-md flex flex-col items-center gap-4">
                                        <div className="px-4 py-2 bg-amber-400/10 border border-amber-400/20 rounded-full text-center">
                                            <p className="text-amber-200 text-xs font-bold tracking-widest">
                                                📸 請大家舉起手機，我們一起拍一張存檔大合照！
                                            </p>
                                        </div>

                                        <div className="flex flex-wrap items-center justify-center gap-3 w-full">
                                            <button 
                                                onClick={() => setStep('celebration')}
                                                className="px-5 py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 text-[#f4ecd8] font-bold text-xs tracking-widest rounded-full transition-all flex items-center gap-2"
                                            >
                                                <Icons.ArrowLeft size={14} /> 回四季大典
                                            </button>
                                            <button 
                                                onClick={() => setStep('finished')}
                                                className="px-5 py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 text-[#f4ecd8] font-bold text-xs tracking-widest rounded-full transition-all flex items-center gap-2"
                                            >
                                                明信片存檔
                                            </button>
                                            <button 
                                                onClick={reset}
                                                className="px-5 py-2.5 bg-[#8b4513] hover:bg-[#a0522d] text-[#f4ecd8] font-black text-xs tracking-widest rounded-full transition-all shadow-lg flex items-center gap-2"
                                            >
                                                <Icons.RefreshCw size={12} /> 重新投遞
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {step === 'writing' && !isFlipped && (
                            <div className="mt-8 sm:mt-16 flex justify-center animate-in fade-in duration-1000 delay-500">
                                <button 
                                    disabled={!message.trim()}
                                    onClick={handleSend}
                                    className="group relative px-12 sm:px-20 py-4 sm:py-5 bg-[#8b4513] text-[#f4ecd8] font-black shadow-[0_8px_0_#4a250a] sm:shadow-[0_12px_0_#4a250a] active:translate-y-2 active:shadow-none transition-all disabled:opacity-20 flex items-center gap-3 sm:gap-4 text-xl sm:text-2xl tracking-[0.2em] uppercase"
                                >
                                    進行投遞 <Icons.Send size={20} className="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" />
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
