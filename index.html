<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昨日限時批 - 時光雜貨店</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #141210;
            color: #f4ecd8;
            margin: 0;
            overflow-x: hidden;
        }

        .perspective-2500 { perspective: 2500px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .will-change-transform { will-change: transform, opacity; }

        @keyframes mail-down {
            0% { transform: translateY(-400px) rotateY(180deg) scale(1.5); opacity: 0; }
            15% { opacity: 1; transform: translateY(-200px) rotateY(180deg) scale(1); }
            100% { transform: translateY(180px) rotateY(180deg) scale(0.2); opacity: 0; }
        }
        .animate-mail-down { animation: mail-down 2.5s cubic-bezier(0.45, 0.03, 0.51, 0.95) forwards; }

        @keyframes mailing-flash {
            0%, 60% { opacity: 0; transform: translateY(-20px); }
            75% { opacity: 1; transform: translateY(0); }
            85% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 0; }
        }
        .animate-mailing-flash { animation: mailing-flash 2.5s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        textarea::placeholder { color: #d1d5db; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 原生向量圖標庫，杜絕 CDN 版本的 API 變更錯誤
        const IconComponents = {
            Send: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            ),
            Heart: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            ),
            RefreshCw: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            ),
            CheckCircle: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            ),
            Mail: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
            ),
            Sparkles: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
                    <path d="M5 3v4"></path>
                    <path d="M19 17v4"></path>
                    <path d="M3 5h4"></path>
                    <path d="M17 19h4"></path>
                </svg>
            ),
            Palette: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
                    <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
                    <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
                    <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
                </svg>
            ),
            Cookie: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"></path>
                    <path d="M8.5 8.5v.01"></path>
                    <path d="M16 15.5v.01"></path>
                    <path d="M12 12v.01"></path>
                    <path d="M11 17v.01"></path>
                    <path d="M7 14v.01"></path>
                </svg>
            ),
            Dices: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect width="12" height="12" x="2" y="10" rx="2" ry="2"></rect>
                    <path d="m17.92 14 3.5-3.5a2.41 2.41 0 0 0 0-3.41l-2.51-2.51a2.41 2.41 0 0 0-3.41 0L12 8.08"></path>
                    <path d="M6 14h.01"></path>
                    <path d="M10 18h.01"></path>
                    <path d="M16 6h.01"></path>
                    <path d="M18 8h.01"></path>
                </svg>
            ),
            Flame: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
                </svg>
            ),
            ChevronRight: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m9 18 6-6-6-6"></path>
                </svg>
            ),
            ArrowLeft: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
            ),
            Camera: ({ size, className }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
                    <circle cx="12" cy="13" r="3"></circle>
                </svg>
            )
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            const Comp = IconComponents[name];
            if (!Comp) return null;
            return <Comp size={size} className={className} />;
        };

        const App = () => {
            const [step, setStep] = useState('writing'); // writing, mailing, finished
            const [message, setMessage] = useState('');
            const [isFlipped, setIsFlipped] = useState(false);
            const [themeKey, setThemeKey] = useState('sunset');

            const stampImg = "https://images.unsplash.com/photo-1579541814924-49fef17c5be5?auto=format&fit=crop&q=60&w=150";

            const themes = useMemo(() => ({
                sunset: {
                    title: '日落',
                    subtitle: '餘暉/傍晚 美/則/美/矣',
                    img: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80',
                },
                sea: {
                    title: '海邊',
                    subtitle: '波光/粼粼 靜/謐/之/境',
                    img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80',
                },
                mountain: {
                    title: '山嶺',
                    subtitle: '層巒/疊嶂 歲/月/悠/長',
                    img: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80',
                }
            }), []);

            useEffect(() => {
                const keys = Object.keys(themes);
                setThemeKey(keys[Math.floor(Math.random() * keys.length)]);
            }, [themes]);

            const currentTheme = themes[themeKey];

            const handleSend = () => {
                if (!message.trim()) return;
                setIsFlipped(true);
                setTimeout(() => {
                    setStep('mailing');
                    setTimeout(() => {
                        setStep('finished');
                    }, 2500);
                }, 1200);
            };

            const reset = () => {
                setMessage('');
                setStep('writing');
                setIsFlipped(false);
                const keys = Object.keys(themes);
                setThemeKey(keys[Math.floor(Math.random() * keys.length)]);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">
                    {/* 背景底紋 */}
                    <div className="fixed inset-0 z-0 opacity-10 pointer-events-none" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/wood-pattern.png")' }}></div>

                    <div className="w-full max-w-4xl z-10 relative">
                        {step === 'writing' && (
                            <div className="text-center mb-10 animate-in fade-in duration-700">
                                <h1 className="text-4xl md:text-5xl font-black text-[#f4ecd8] tracking-[0.3em] italic">昨日限時批</h1>
                                <p className="text-amber-600/50 text-[10px] uppercase tracking-[0.5em] mt-2">Memory Postcard Archive</p>
                            </div>
                        )}

                        <div className="perspective-2500 w-full flex justify-center">
                            {step === 'writing' && (
                                <div className={`relative w-full max-w-2xl aspect-[1.6/1] transition-all duration-[1200ms] transform-style-3d will-change-transform ${isFlipped ? 'rotate-y-180 scale-75 -translate-y-12' : ''}`}>
                                    {/* 背面 */}
                                    <div className="absolute inset-0 bg-[#fffdf9] p-8 md:p-12 shadow-2xl border border-zinc-200 backface-hidden flex gap-8 rounded-sm overflow-hidden z-20">
                                        <div className="absolute top-8 left-10 flex gap-1 opacity-40">
                                            {[1,2,3,4,5,6].map(i => <div key={i} className="w-5 h-7 border border-red-500"></div>)}
                                        </div>
                                        <div className="flex-1 flex flex-col pt-12 text-[#2c1e1a]">
                                            <textarea 
                                                placeholder="寫給那個曾經的自己... 可以是謝謝，也可以是對不起。"
                                                className="w-full flex-1 bg-transparent border-none focus:outline-none text-2xl italic leading-relaxed placeholder:text-zinc-200 resize-none py-2"
                                                style={{ backgroundImage: 'linear-gradient(transparent, transparent 39px, #e5e5e5 39px)', backgroundSize: '100% 40px' }}
                                                value={message}
                                                onChange={(e) => setMessage(e.target.value)}
                                            ></textarea>
                                        </div>
                                        <div className="w-60 flex flex-col border-l border-dotted border-zinc-200 pl-8 pt-4">
                                            <div className="flex justify-end mb-10">
                                                <div className="w-24 h-28 border-2 border-zinc-200 p-1 flex items-center justify-center bg-white shadow-sm overflow-hidden">
                                                   <img src={stampImg} alt="Stamp" className="w-full h-full object-cover opacity-80" />
                                                </div>
                                            </div>
                                            <div className="space-y-10 text-[#1a1612]">
                                                <div className="border-b border-zinc-100 text-sm text-zinc-400 pb-2">
                                                   <span className="font-bold tracking-tighter uppercase">To: </span>
                                                   <span className="text-zinc-800 font-bold ml-2">那個時空的 我</span>
                                                </div>
                                                <div className="border-b border-zinc-100 h-8"></div>
                                                <div className="border-b border-zinc-100 text-sm text-zinc-400 pb-2">
                                                   <span className="font-bold tracking-tighter uppercase">From: </span>
                                                   <span className="text-zinc-800 font-bold ml-2">現在的我</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    {/* 正面 */}
                                    <div className="absolute inset-0 bg-white shadow-2xl border border-zinc-200 backface-hidden rotate-y-180 flex flex-col rounded-sm p-3 z-10">
                                        <div className="flex-1 relative overflow-hidden rounded-sm">
                                            <img src={currentTheme.img} alt="Postcard Front" className="w-full h-full object-cover" />
                                        </div>
                                        <div className="h-20 flex justify-between items-end px-2 pt-2 pb-1 text-[#1a1612]">
                                            <div className="flex items-baseline gap-4">
                                                <span className="text-4xl font-black italic tracking-tighter">{currentTheme.title}</span>
                                                <span className="text-[10px] font-bold text-zinc-300 uppercase tracking-widest">實/拍/明/信/片</span>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-[11px] font-black tracking-widest italic">{currentTheme.subtitle}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 'mailing' && (
                                <div className="flex flex-col items-center">
                                    <div className="absolute top-[-250px] w-64 aspect-[1.6/1] bg-white shadow-2xl animate-mail-down overflow-hidden rounded-sm z-50 p-1 border border-zinc-200">
                                        <img src={currentTheme.img} alt="mailing" className="w-full h-full object-cover" />
                                    </div>
                                    {/* 郵筒 */}
                                    <div className="relative w-56 h-80 flex flex-col items-center">
                                        <div className="w-44 h-20 bg-green-800 rounded-t-full border-t-4 border-green-700 shadow-lg relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-white/10 to-transparent"></div>
                                        </div>
                                        <div className="w-40 h-64 bg-green-800 border-x-4 border-green-900 shadow-2xl flex flex-col items-center relative">
                                            <div className="absolute inset-0 bg-gradient-to-r from-black/30 via-transparent to-black/30"></div>
                                            <div className="w-32 h-8 bg-zinc-950 mt-10 rounded-sm shadow-[inset_0_4px_12px_rgba(0,0,0,1)] flex items-center justify-center relative overflow-hidden">
                                                <div className="absolute inset-0 flex items-center justify-center animate-mailing-flash">
                                                   <div className="w-24 h-16 bg-white/20 blur-md"></div>
                                                </div>
                                            </div>
                                            <div className="mt-12 w-20 h-20 border-4 border-green-700/30 rounded-full flex items-center justify-center bg-green-900/40">
                                               <Icon name="Mail" size={32} className="text-green-200 opacity-20" />
                                            </div>
                                        </div>
                                        <div className="w-48 h-6 bg-zinc-900 rounded-sm shadow-xl"></div>
                                    </div>
                                    <p className="mt-16 text-[#f4ecd8] animate-pulse tracking-[1em] font-black uppercase text-xs">穿越時空投遞中...</p>
                                </div>
                            )}

                            {step === 'finished' && (
                                <div className="w-full flex flex-col items-center animate-in zoom-in duration-1000 pb-20 px-4">
                                    <div className="text-center mb-8">
                                        <div className="w-12 h-12 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-amber-500/20">
                                            <Icon name="CheckCircle" className="text-amber-500" size={32} />
                                        </div>
                                        <h2 className="text-3xl font-black text-[#f4ecd8] tracking-widest italic">時光存檔成功</h2>
                                        <p className="text-amber-600/50 text-[10px] font-bold tracking-[0.4em] mt-2 uppercase">Official Memory Capture</p>
                                    </div>

                                    <div className="relative group animate-float max-w-3xl w-full">
                                        <div className="absolute -inset-8 bg-amber-500/5 blur-[80px] rounded-full"></div>
                                        <div className="relative bg-[#fffdf9] p-8 md:p-12 shadow-[0_40px_80px_rgba(0,0,0,0.5)] border-[16px] border-white overflow-hidden rounded-sm min-h-[460px] flex gap-10">
                                            <div className="absolute inset-0 z-0">
                                                <img src={currentTheme.img} alt="Postcard Background" className="w-full h-full object-cover opacity-60" />
                                                <div className="absolute inset-0 bg-white/10"></div>
                                            </div>
                                            <div className="flex-1 flex flex-col pt-12 relative z-10">
                                                <div className="absolute top-[-36px] left-0 flex gap-1.5 opacity-50">
                                                    {[1,2,3,4,5,6].map(i => <div key={i} className="w-7 h-9 border-2 border-red-400"></div>)}
                                                </div>
                                                <div 
                                                    className="w-full flex-1 text-[#1a110a] font-black italic leading-relaxed font-serif pt-2 drop-shadow-sm overflow-hidden"
                                                    style={{ 
                                                        fontSize: message.length > 100 ? '1.1rem' : message.length > 50 ? '1.5rem' : '2.1rem',
                                                        backgroundImage: 'linear-gradient(transparent, transparent 39px, rgba(0,0,0,0.1) 39px)',
                                                        backgroundSize: '100% 40px',
                                                        paddingBottom: '20px'
                                                    }}
                                                >
                                                    "{message}"
                                                </div>
                                            </div>
                                            <div className="w-64 flex flex-col border-l border-dotted border-black/10 pl-10 pt-4 relative z-10">
                                                <div className="flex justify-end mb-12">
                                                    <div className="w-28 h-32 border-2 border-black/5 p-1 flex items-center justify-center bg-white shadow-sm overflow-hidden">
                                                        <img src={stampImg} alt="Final Stamp" className="w-full h-full object-cover opacity-90" />
                                                    </div>
                                                </div>
                                                <div className="space-y-12 mt-4 text-[#1a110a]">
                                                    <div className="border-b border-black/10 text-sm text-zinc-600 pb-3 flex items-center gap-2">
                                                        <span className="font-bold tracking-tighter uppercase whitespace-nowrap">To: </span>
                                                        <span className="font-black text-lg tracking-tighter">那個時空的 我</span>
                                                    </div>
                                                    <div className="border-b border-black/10 h-10"></div>
                                                    <div className="border-b border-black/10 text-sm text-zinc-600 pb-3 flex items-center gap-2">
                                                        <span className="font-bold tracking-tighter uppercase whitespace-nowrap">From: </span>
                                                        <span className="font-black text-lg tracking-tighter">現在的我</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-12 flex flex-col items-center gap-6">
                                        <p className="text-xs font-bold tracking-widest text-[#f4ecd8]/40 text-center uppercase">
                                            請截圖保存這份證明。
                                        </p>
                                        <button onClick={reset} className="px-10 py-3 bg-white/5 border border-white/10 text-[#f4ecd8]/50 hover:text-[#f4ecd8] text-xs font-bold uppercase tracking-[0.4em] rounded-full transition-all">
                                            <Icon name="RefreshCw" size={14} className="inline mr-2" /> 重新投遞
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {step === 'writing' && !isFlipped && (
                            <div className="mt-16 flex justify-center animate-in fade-in duration-1000 delay-500">
                                <button 
                                    disabled={!message.trim()}
                                    onClick={handleSend}
                                    className="group relative px-20 py-5 bg-[#8b4513] text-[#f4ecd8] font-black shadow-[0_12px_0_#4a250a] active:translate-y-2 active:shadow-none transition-all disabled:opacity-20 flex items-center gap-4 text-2xl tracking-[0.2em] uppercase"
                                >
                                    進行投遞 <Icon name="Send" size={24} className="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" />
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
